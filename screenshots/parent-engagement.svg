<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b4d24"/>
      <stop offset="1" stop-color="#6e3416"/>
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.30"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f6f1e8"/>
    </marker>
  </defs>
  <rect width="1200" height="760" fill="#181512"/>

  <text x="600" y="48" font-size="22" font-weight="700" fill="#f6f1e8" text-anchor="middle">Parent Engagement · trip-leader parent recruitment funnel</text>
  <text x="600" y="74" font-size="13" fill="#a3958a" text-anchor="middle">FastAPI · Postgres · HTMX · live Tourbot read path · Mandrill engagement</text>

  <g filter="url(#sh)">
    <rect x="50" y="120" width="240" height="160" rx="12" fill="#241a12" stroke="#5b3a23"/>
    <text x="70" y="155" font-size="12" font-weight="700" fill="#c8956a" letter-spacing="1.5">TEACHER</text>
    <text x="70" y="190" font-size="15" fill="#f6f1e8">Trip leader signs in</text>
    <text x="70" y="214" font-size="13" fill="#c8b6aa">group roster from</text>
    <text x="70" y="234" font-size="13" fill="#c8b6aa">Tourbot (read-only)</text>
    <text x="70" y="260" font-size="12" fill="#a3958a">demo login · live reg counts</text>
  </g>

  <g filter="url(#sh)">
    <rect x="340" y="120" width="240" height="160" rx="12" fill="#241a12" stroke="#5b3a23"/>
    <text x="360" y="155" font-size="12" font-weight="700" fill="#c8956a" letter-spacing="1.5">INVITE</text>
    <text x="360" y="190" font-size="15" fill="#f6f1e8">Info-night invites</text>
    <text x="360" y="214" font-size="13" fill="#c8b6aa">RSVP collection +</text>
    <text x="360" y="234" font-size="13" fill="#c8b6aa">drip email sequence</text>
    <text x="360" y="260" font-size="12" fill="#a3958a">scheduler service</text>
  </g>

  <g filter="url(#sh)">
    <rect x="630" y="120" width="240" height="160" rx="12" fill="#241a12" stroke="#5b3a23"/>
    <text x="650" y="155" font-size="12" font-weight="700" fill="#c8956a" letter-spacing="1.5">ATTEND</text>
    <text x="650" y="190" font-size="15" fill="#f6f1e8">Night attendance</text>
    <text x="650" y="214" font-size="13" fill="#c8b6aa">check-in for parents</text>
    <text x="650" y="234" font-size="13" fill="#c8b6aa">who showed up</text>
    <text x="650" y="260" font-size="12" fill="#a3958a">engagement events</text>
  </g>

  <g filter="url(#sh)">
    <rect x="920" y="120" width="230" height="160" rx="12" fill="url(#brand)" stroke="#5b3a23"/>
    <text x="940" y="155" font-size="12" font-weight="700" fill="#ffe9d2" letter-spacing="1.5">REGISTER</text>
    <text x="940" y="190" font-size="15" fill="#fff">Registration funnel</text>
    <text x="940" y="214" font-size="13" fill="#ffe9d2">into Tourbot booking</text>
    <text x="940" y="234" font-size="13" fill="#ffe9d2">for the group trip</text>
    <text x="940" y="260" font-size="12" fill="#f0d4b8">revenue path</text>
  </g>

  <line x1="290" y1="200" x2="336" y2="200" stroke="#f6f1e8" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="580" y1="200" x2="626" y2="200" stroke="#f6f1e8" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="870" y1="200" x2="916" y2="200" stroke="#f6f1e8" stroke-width="2.5" marker-end="url(#arr)"/>

  <g filter="url(#sh)">
    <rect x="50" y="340" width="540" height="280" rx="14" fill="#1f1c18" stroke="#3a342c"/>
    <text x="70" y="380" font-size="15" font-weight="700" fill="#f6f1e8">Stack &amp; host</text>
    <text x="70" y="416" font-size="13" fill="#e9ddd2">Python 3.12 · FastAPI · Jinja · HTMX</text>
    <text x="70" y="440" font-size="13" fill="#e9ddd2">Postgres 16 · Caddy auto-TLS</text>
    <text x="70" y="464" font-size="13" fill="#e9ddd2">Dedicated Rocky 9 droplet (own host)</text>
    <text x="70" y="488" font-size="13" fill="#e9ddd2">systemd: web · scheduler · nightly backup</text>
    <text x="70" y="512" font-size="13" fill="#e9ddd2">SELinux enforcing · least-privilege app user</text>
    <text x="70" y="560" font-size="13" fill="#7fb79a" font-weight="700">Live: parents.etadventures.com</text>
  </g>

  <g filter="url(#sh)">
    <rect x="620" y="340" width="530" height="280" rx="14" fill="#1f1c18" stroke="#3a342c"/>
    <text x="640" y="380" font-size="15" font-weight="700" fill="#f6f1e8">Integration boundaries</text>
    <text x="640" y="416" font-size="13" fill="#e9ddd2">Tourbot DB: read-only views for reg counts</text>
    <text x="640" y="440" font-size="13" fill="#e9ddd2">and group context (no production writes)</text>
    <text x="640" y="464" font-size="13" fill="#e9ddd2">Mandrill webhooks: HMAC-verified opens/clicks</text>
    <text x="640" y="488" font-size="13" fill="#e9ddd2">via shared webhook-verify primitive</text>
    <text x="640" y="512" font-size="13" fill="#e9ddd2">Email delivery flag-gated for pilot safety</text>
    <text x="640" y="560" font-size="13" fill="#7fb79a" font-weight="700">Prototype → pilot-ready hybrid cutover plan</text>
  </g>

  <text x="600" y="700" font-size="12" fill="#a3958a" text-anchor="middle">Split from the orchestration monorepo into its own deployable service</text>
